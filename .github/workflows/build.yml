name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.29.0'

      - name: Flutter create (generate platform files)
        run: |
          flutter create . --project-name iosipa_wang --org com.kuai88ipa

      - name: Set app name
        run: |
          sed -i 's/android:label="iosipa_wang"/android:label="iosipa.wang"/' android/app/src/main/AndroidManifest.xml
          grep 'android:label' android/app/src/main/AndroidManifest.xml

      - name: Enable internet permission
        run: |
          if ! grep -q "INTERNET" android/app/src/main/AndroidManifest.xml; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iosipa-wang-apk
          path: build/app/outputs/flutter-apk/app-release.apk
